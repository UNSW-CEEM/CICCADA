[project]
name = "ciccada"
version = "0.1.0"
description = "A package for analysing compliance and curtailment of consumer energy resources."
authors = [
    { name = "nick-gorman", email = "n.gorman305@gmail.com" },
]
dependencies = [
    "boto3>=1.43.72",
    "ipykernel>=7.3.0",
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.0",
    "mplcursors>=0.7.1",
    "mpld3>=0.5.12",
    "numpy>=2.2.3",
    "pandas>=2.2.2",
    "polars>=1.41.2",
    "pyarrow>=24.0.0",
    "pytest-cov>=6.0.0",
    "pytest>=8.3.4",
    "ruff>=0.16.5",
    "sqlalchemy>=2.0.52",
    "trino>=0.338.0",
    "xlsxwriter>=3.2.9",
]
readme = "README.md"
requires-python = ">= 3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true
dev-dependencies = [
    "pytest>=8.3.2",
    "pytest-cov>=6.0.0",
    "pre-commit>=3.8.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ciccada"]

[tool.pytest.ini_options]
# path to tests for pytest
testpaths = ["src", "tests"]
# addopts = add options
# --cov points pytest-cov to the src/ dir
# --cov-branch runs branch coverage
 addopts = "-ra --doctest-modules --cov=src/ --cov-branch --cov-report xml:tests/coverage.xml --cov-report html:tests/htmlcov"

[tool.ruff.lint]
select = [
    # isort
    "I",
]
