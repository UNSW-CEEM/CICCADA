[paths]
telemetry_parquet = 'C:\Users\z3553082\OneDrive - UNSW\Documents\CICCADA - Data\Ausgrid\ausgrid_pv_combined.parquet'
metadata_workbook = 'C:\Users\z3553082\OneDrive - UNSW\Documents\CICCADA - Data\Ausgrid\ausgrid_meta.xlsx'
derived_root = 'C:\Users\z3553082\OneDrive - UNSW\Documents\CICCADA - Data\Ausgrid\derived'

[metadata]
sheet_name = "Cust_DER_Network Data"
id_column = "Unique Number ID"

[telemetry]
site_column = "serial"
timestamp_column = "MeasureTime"
phase_column = "Vphase"
voltage_column = "Volts"
current_column = "Curr"
reactive_power_column = "ReactPow"
active_power_column = "ActivePow"
source_month_column = "month"
source_file_column = "source_file"

[assumptions]
# Working hypotheses. Raw fields are always retained, so either sign can be
# changed later without re-reading the source CSV files.
active_export_sign = -1
reactive_absorbing_sign = -1
source_timezone = "UTC"
local_timezone = "Australia/Sydney"
power_sample_type = "instantaneous"
measurement_location = "unknown"

[quality]
voltage_min_v = 0.0
voltage_max_v = 300.0
duplicate_float_tolerance = 0.000001

[processing]
site_bucket_count = 32
threads = 4
memory_limit = "8GB"
parquet_compression = "zstd"

# Append this table to config/analysis.example.toml.
[mechanism_analysis]
voltage_aggregate = "avg"
# der_inferred (default) = DER-mapped phase(s) only; all_phases = every
# phase regardless of DER mapping, a named sensitivity/comparison track.
# See docs/MECHANISM_RESULTS.md.
phase_scope_basis = "der_inferred"
capacity_basis = "s_rated_kva"
tolerance_fraction = 0.04
voltage_bin_width_v = 1.0
sign_audit_month = "2025-01"
sign_audit_site_count = 3
minimum_response_intervals = 12
minimum_response_voltage_span_v = 3.0
active_sign_review_state = "unverified"
reactive_sign_review_state = "unverified"
